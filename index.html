<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3ecdf" />
    <title>折角</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='4' width='16' height='24' rx='1.2' fill='%23fffaf3' stroke='%235e564c' stroke-width='1.6'/%3E%3Cpath d='M16.5 4.8h7v7.2l-7-7.2z' fill='%23f3ecdf' stroke='%232d5a47' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      try {
        var pref = localStorage.getItem('read-life.theme') || 'system'
        if (pref === 'light') pref = 'paper'
        if (pref === 'dark') pref = 'night'
        var known = { paper: 1, bamboo: 1, frost: 1, night: 1 }
        var systemDark = matchMedia('(prefers-color-scheme: dark)').matches
        var theme = known[pref] ? pref : (systemDark ? 'night' : 'paper')
        var scheme = theme === 'night' ? 'dark' : 'light'
        var colors = { paper: '#f3ecdf', bamboo: '#d5e3d4', frost: '#e6eef1', night: '#12100e' }
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.scheme = scheme
        document.documentElement.style.colorScheme = scheme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
